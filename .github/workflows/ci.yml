name: CI

on:
  push:
    branches: [main, improve-core-reproducibility, improve-reproducibility-manifests]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Required Ruff checks
        run: >-
          python -m ruff check
          run_all.py
      - name: Build package
        run: python -m build
      - name: Repository-wide Ruff baseline
        continue-on-error: true
        run: python -m ruff check .
      - name: Repository-wide mypy baseline
        continue-on-error: true
        run: python -m mypy collatz_graph