[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inverse-collatz-graph"
version = "0.1.0"
description = "Reproducible experiments on bounded inverse Collatz graphs"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "networkx>=3.2,<4",
    "matplotlib>=3.8,<4",
    "tqdm>=4.66,<5",
]

[project.scripts]
collatz-node2vec = "collatz_graph.node2vec_cli:main"
collatz-node2vec-umap = "collatz_graph.embedding_plots_cli:main"
collatz-clustering = "collatz_graph.clustering_cli:main"
collatz-supervised = "collatz_graph.supervised_cli:main"

[tool.setuptools.packages.find]
include = ["collatz_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
